name: Production gates

on:
  pull_request:
  push:
    branches: [main, feature/searxng]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  MIN_VSCODE_VERSION: 1.131.0

jobs:
  quality-and-package:
    name: Quality, security, and VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-test-results.mjs
      - run: npm run compile
      - run: npm run lint
      - run: npm run test:unit
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit build chain
        run: npm audit --audit-level=critical
      - run: npm run build
      - run: npm run package:vsix
      - run: npm run verify:vsix
      - run: node scripts/write-artifact-checksum.mjs artifacts/*.vsix artifacts/sha256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: production-vsix
          path: artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-test-results
          path: test-results/
          if-no-files-found: warn

  extension-host:
    name: Extension host (${{ matrix.os }}, VS Code ${{ matrix.vscode }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vscode: [1.131.0, stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-test-results.mjs
      - name: Run extension-host integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration -- --code-version ${{ matrix.vscode }} --reporter xunit --reporter-option output=test-results/integration.xml
      - name: Run extension-host integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration -- --code-version ${{ matrix.vscode }} --reporter xunit --reporter-option output=test-results/integration.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: extension-host-${{ matrix.os }}-${{ matrix.vscode }}
          path: test-results/
          if-no-files-found: warn

  packaged-smoke:
    name: Installed VSIX smoke (VS Code ${{ matrix.vscode }})
    needs: quality-and-package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: [1.131.0, stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: production-vsix
          path: artifacts
      - run: npm run prepare:integration
      - run: xvfb-run -a node scripts/test-packaged-vsix.mjs artifacts/*.vsix ${{ matrix.vscode }}

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality-and-package, extension-host, packaged-smoke]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: production-vsix
          path: artifacts
      - name: Verify release artifact checksum
        run: cd artifacts && sha256sum --check sha256.txt
      - name: Prepare release notes
        run: node scripts/extract-release-notes.mjs CHANGELOG.md package.json "$GITHUB_REF_NAME" release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          artifacts/*.vsix
          artifacts/sha256.txt
          --title "Yar's DeepSeek Copilot $GITHUB_REF_NAME"
          --notes-file release-notes.md
          --prerelease
          --verify-tag
