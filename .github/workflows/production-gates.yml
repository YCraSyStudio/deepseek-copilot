name: Production gates

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-package:
    name: Quality, security, and VSIX
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release-mode.outputs.release }}
      tag: ${{ steps.release-mode.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect a release request
        id: release-mode
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: node scripts/detect-release-mode.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-test-results.mjs
      - run: npm run compile
      - run: npm run lint
      - run: npm run audit:dead-code
      - run: npm run test:unit
      - run: npm run verify:searxng-runtime-config
      - name: Verify published SearXNG runtime
        if: steps.release-mode.outputs.release == 'true'
        run: npm run verify:searxng-runtime
      - name: Validate release tag and changelog
        if: steps.release-mode.outputs.release == 'true'
        env:
          TAG: ${{ steps.release-mode.outputs.tag }}
        run: node scripts/extract-release-notes.mjs CHANGELOG.md package.json "$TAG" release-notes.md
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit build chain
        run: npm audit --audit-level=critical
      - run: npm run build
      - run: npm run package:vsix
      - run: npm run verify:vsix
      - run: node scripts/write-artifact-checksum.mjs artifacts/*.vsix artifacts/sha256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: production-vsix
          path: artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-test-results
          path: test-results/
          if-no-files-found: warn

  extension-host:
    name: Extension host (${{ matrix.os }}, VS Code stable)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-test-results.mjs
      - name: Run extension-host integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration -- --code-version stable --reporter xunit --reporter-option output=test-results/integration.xml
      - name: Run extension-host integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration -- --code-version stable --reporter xunit --reporter-option output=test-results/integration.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: extension-host-${{ matrix.os }}
          path: test-results/
          if-no-files-found: warn

  packaged-smoke:
    name: Installed VSIX smoke (VS Code stable)
    needs: quality-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: production-vsix
          path: artifacts
      - run: npm run prepare:integration
      - run: xvfb-run -a node scripts/test-packaged-vsix.mjs artifacts/*.vsix stable

  github-release:
    name: GitHub release
    needs: [quality-and-package, extension-host, packaged-smoke]
    if: needs.quality-and-package.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      TAG: ${{ needs.quality-and-package.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Look for an existing release
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release skipped::$TAG is already published."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Ensure the release tag exists
        if: steps.published.outputs.published == 'false'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "$TAG already exists on origin."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
            echo "Created $TAG at $GITHUB_SHA."
          fi
      - uses: actions/download-artifact@v8
        if: steps.published.outputs.published == 'false'
        with:
          name: production-vsix
          path: artifacts
      - name: Verify release artifact checksum
        if: steps.published.outputs.published == 'false'
        run: cd artifacts && sha256sum --check sha256.txt
      - name: Prepare release notes
        if: steps.published.outputs.published == 'false'
        run: node scripts/extract-release-notes.mjs CHANGELOG.md package.json "$TAG" release-notes.md
      - name: Create GitHub release
        if: steps.published.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG"
          artifacts/*.vsix
          artifacts/sha256.txt
          --title "Yar's DeepSeek Copilot $TAG"
          --notes-file release-notes.md
          --prerelease
          --verify-tag
