name: SearXNG runtime

on:
  workflow_dispatch:
  push:
    branches: [feature/searxng]
    paths:
      - "scripts/build-searxng-runtime.py"
      - "scripts/create-searxng-runtime-manifest.mjs"
      - "scripts/fetch-searxng-build-source.py"
      - "scripts/searxng-runtime-entry.py"

permissions:
  contents: write

env:
  SEARXNG_COMMIT: 9fea41204fdfa7a5cfa15b0ebd12904c520478ce
  SEARXNG_RUNTIME_VERSION: 2026.08.22-9fea41204-v3
  SEARXNG_RUNTIME_TAG: searxng-runtime-2026.08.22-9fea41204-v3
  REQUIRED_RUNTIME_KEYS: linux-x64,linux-arm64,win32-x64,darwin-x64,darwin-arm64

jobs:
  build:
    name: Build ${{ matrix.key }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x64
            os: ubuntu-22.04
          - key: linux-arm64
            os: ubuntu-22.04-arm
          - key: win32-x64
            os: windows-2022
          - key: darwin-x64
            os: macos-15-intel
          - key: darwin-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Fetch pinned SearXNG build source
        run: python scripts/fetch-searxng-build-source.py "$SEARXNG_COMMIT" .tmp/searxng-source
        shell: bash
      - name: Install frozen-runtime build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.16.0"
          python -m pip install -r .tmp/searxng-source/requirements.txt
          python -m pip install --no-build-isolation --no-deps -e .tmp/searxng-source
      - name: Build and smoke-test runtime
        run: python scripts/build-searxng-runtime.py .tmp/searxng-source runtime-dist
      - uses: actions/upload-artifact@v7
        with:
          name: searxng-runtime-${{ matrix.key }}
          path: runtime-dist/searxng-runtime-*
          if-no-files-found: error

  publish:
    name: Publish immutable pinned runtime release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Refuse to mutate an existing runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$SEARXNG_RUNTIME_TAG" >/dev/null 2>&1; then
            echo "::error::Runtime release $SEARXNG_RUNTIME_TAG already exists. Bump SEARXNG_RUNTIME_VERSION instead of replacing published assets."
            exit 1
          fi
      - name: Prepare corresponding SearXNG source
        run: python scripts/fetch-searxng-build-source.py "$SEARXNG_COMMIT" .tmp/searxng-source
      - uses: actions/download-artifact@v8
        with:
          pattern: searxng-runtime-*
          path: runtime-dist
          merge-multiple: true
      - name: Create runtime manifest
        run: node scripts/create-searxng-runtime-manifest.mjs runtime-dist
      - name: Add corresponding SearXNG source and license
        shell: bash
        run: |
          tar -czf "runtime-dist/searxng-source-${SEARXNG_COMMIT:0:12}.tar.gz" -C .tmp/searxng-source .
          cp .tmp/searxng-source/LICENSE runtime-dist/SEARXNG-LICENSE.txt
          printf '%s\n' \
            'SearXNG is distributed as a separate executable sidecar under AGPL-3.0-or-later.' \
            "Exact upstream source commit: $SEARXNG_COMMIT" \
            'The corresponding source archive contains the exact portability patch used by the binaries.' \
            "Corresponding source archive: searxng-source-${SEARXNG_COMMIT:0:12}.tar.gz" \
            > runtime-dist/SEARXNG-NOTICE.txt
      - name: Publish runtime assets once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$SEARXNG_RUNTIME_TAG" \
            --target "$GITHUB_SHA" \
            --title "SearXNG runtime $SEARXNG_RUNTIME_VERSION" \
            --notes "Pinned SearXNG sidecar runtimes used by DeepSeek Copilot. Published assets are immutable; the extension trusts only checksums embedded in its VSIX." \
            --prerelease
          gh release upload "$SEARXNG_RUNTIME_TAG" runtime-dist/*
